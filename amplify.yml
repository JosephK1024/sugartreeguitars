version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm ci --cache .npm --prefer-offline
        - env | grep -e STRIPE_SECRET_KEY -e NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY -e NEXT_PUBLIC_SITE_URL -e STRIPE_WEBHOOK_SECRET >> .env.production || true
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - .next/cache/**/*
      - .npm/**/*
      - node_modules/**/*
